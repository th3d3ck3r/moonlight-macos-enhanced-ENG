name: Validate Liquid UI Preview
on:
  push:
    branches: [liquid-ui]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liquid-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[release-metadata]')
    name: Liquid UI macOS ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: x86_64
            runner: macos-26
            archs: x86_64
          - variant: universal
            runner: macos-26
            archs: x86_64 arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Audit English UI and LAN configuration
        run: |
          python3 scripts/audit_english.py
          python3 scripts/audit_update_isolation.py
      - name: Build and test customized common-c
        run: |
          cmake -S moonlight-common/moonlight-common-c -B common-test -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build common-test --parallel 3
          ASAN_OPTIONS=detect_leaks=0 ctest --test-dir common-test --output-on-failure
      - name: Test native host XML security and compatibility
        run: |
          xcrun clang -fobjc-arc -fsanitize=address,undefined -fno-omit-frame-pointer -framework Foundation -lxml2 \
            -I tests/host-response -I Limelight/Network -I "$(xcrun --show-sdk-path)/usr/include/libxml2" \
            -include tests/host-response/Support.h \
            Limelight/Network/HttpResponse.m Limelight/Network/AppListResponse.m \
            tests/host-response/HostResponseTests.m -o /tmp/host-response-tests
          ASAN_OPTIONS=detect_leaks=0 /tmp/host-response-tests
      - name: Test production credential redaction
        shell: bash
        run: |
          set -o pipefail
          xcrun clang -fobjc-arc -fsanitize=address,undefined -fno-omit-frame-pointer -framework Foundation \
            -I Limelight/Utility Limelight/Utility/Logger.m Limelight/Utility/LogBuffer.m \
            tests/logging/LogRedactionTests.m -o /tmp/log-redaction-tests
          ASAN_OPTIONS=detect_leaks=0 /tmp/log-redaction-tests 2>&1 | tee /tmp/log-redaction-output.txt
          if grep -q 'SENSITIVE_.*_VALUE' /tmp/log-redaction-output.txt; then
            echo 'Credential redaction failed for console output'
            exit 1
          fi
      - name: Test floating handle display-cycle regression
        run: bash tests/edge-menu/run.sh
      - name: Download native dependencies
        run: |
          curl --fail --location --retry 3 -o xcframeworks.zip https://github.com/coofdy/moonlight-mobile-deps/releases/download/latest/moonlight-apple-xcframeworks.zip
          unzip -q -o xcframeworks.zip -d xcframeworks
      - name: Build full macOS application
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project Moonlight.xcodeproj -scheme 'Moonlight for macOS' \
            -configuration Release -derivedDataPath build -destination 'generic/platform=macOS' \
            ARCHS='${{ matrix.archs }}' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            BUILD_NUMBER='${{ github.run_number }}' build 2>&1 | tee build.log
      - name: Validate produced application
        shell: bash
        run: |
          app=build/Build/Products/Release/Moonlight.app
          for arch in ${{ matrix.archs }}; do
            lipo "$app/Contents/MacOS/Moonlight" -verify_arch "$arch"
            lipo "$app/Contents/Library/LaunchServices/std.skyhua.MoonlightMac.AwdlPrivilegedHelper" -verify_arch "$arch"
          done
          python3 scripts/audit_english.py --app "$app"
          python3 scripts/audit_update_isolation.py --app "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" 'Moonlight-manual-${{ matrix.variant }}.zip'
      - name: Capture actual main window and Settings on Mac runner
        if: matrix.variant == 'universal'
        continue-on-error: true
        shell: bash
        run: |
          app=build/Build/Products/Release/Moonlight.app
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          defaults write "$bundle" welcome.permissions.shown.v1 -bool true
          open "$app"
          sleep 5
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            repeat with candidateProcess in application processes
              try
                repeat with candidateWindow in windows of candidateProcess
                  set permissionElements to entire contents of candidateWindow
                  set permissionText to ""
                  repeat with permissionElement in permissionElements
                    try
                      if class of permissionElement is static text then set permissionText to permissionText & (value of permissionElement as text)
                    end try
                  end repeat
                  if permissionText contains "Moonlight" and permissionText contains "local network" then
                    repeat with permissionElement in permissionElements
                      try
                        if class of permissionElement is button and name of permissionElement is "Allow" then click permissionElement
                      end try
                    end repeat
                  end if
                end repeat
              end try
            end repeat
          end tell
          APPLESCRIPT
          # Coordinate fallback is grounded in the captured 1024x768 runner
          # permission dialog. A click on empty content is harmless if dismissed.
          swift - <<'SWIFT'
          import CoreGraphics
          let display = CGMainDisplayID()
          guard CGDisplayPixelsWide(display) == 1024 && CGDisplayPixelsHigh(display) == 768 else {
              fatalError("Runner display changed; review permission-dialog coordinates")
          }
          let point = CGPoint(x: 572, y: 339)
          CGEvent(mouseEventSource: nil, mouseType: .leftMouseDown, mouseCursorPosition: point, mouseButton: .left)?.post(tap: .cghidEventTap)
          CGEvent(mouseEventSource: nil, mouseType: .leftMouseUp, mouseCursorPosition: point, mouseButton: .left)?.post(tap: .cghidEventTap)
          SWIFT
          sleep 2
          osascript -e 'tell application "Moonlight" to activate'
          mkdir -p screenshots
          screencapture -x screenshots/main-window-actual.png
          osascript -e 'tell application "System Events" to keystroke "," using command down'
          sleep 2
          screencapture -x screenshots/settings-actual.png
          for pane in Video Audio Input App; do
            # Native pointer clicks use sidebar row positions observed in the
            # centered 760x580 Settings window on this guarded runner display.
            swift - "$pane" <<'SWIFT'
          import CoreGraphics
          let rows: [String: Double] = ["Video": 170, "Audio": 203, "Input": 235, "App": 267]
          guard let name = CommandLine.arguments.last, let y = rows[name] else { fatalError("Unknown pane") }
          let point = CGPoint(x: 200, y: y)
          CGEvent(mouseEventSource: nil, mouseType: .leftMouseDown, mouseCursorPosition: point, mouseButton: .left)?.post(tap: .cghidEventTap)
          CGEvent(mouseEventSource: nil, mouseType: .leftMouseUp, mouseCursorPosition: point, mouseButton: .left)?.post(tap: .cghidEventTap)
          SWIFT
            sleep 1
            screencapture -x "screenshots/settings-$pane-actual.png"
          done
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true'
          sleep 2
          screencapture -x screenshots/settings-dark-actual.png
          osascript -e 'tell application "System Events" to keystroke "w" using command down'
          sleep 1
          screencapture -x screenshots/main-window-dark-actual.png
          osascript -e 'tell application "System Events" to keystroke "q" using command down'
      - uses: actions/upload-artifact@v6
        if: matrix.variant == 'universal' && always()
        with:
          name: liquid-ui-actual-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-manual-${{ matrix.variant }}
          path: |
            build.log
            Moonlight-manual-${{ matrix.variant }}.zip
          if-no-files-found: warn
