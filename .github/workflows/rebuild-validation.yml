name: Validate English Manual Build
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-rebuild-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[release-metadata]')
    name: Manual macOS ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: x86_64
            runner: macos-26
            archs: x86_64
          - variant: universal
            runner: macos-26
            archs: x86_64 arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Audit English UI and LAN configuration
        run: |
          python3 scripts/audit_english.py
          python3 scripts/audit_update_isolation.py
      - name: Build and test customized common-c
        run: |
          cmake -S moonlight-common/moonlight-common-c -B common-test -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build common-test --parallel 3
          ASAN_OPTIONS=detect_leaks=0 ctest --test-dir common-test --output-on-failure
      - name: Test native host XML security and compatibility
        run: |
          xcrun clang -fobjc-arc -fsanitize=address,undefined -fno-omit-frame-pointer -framework Foundation -lxml2 \
            -I tests/host-response -I Limelight/Network -I "$(xcrun --show-sdk-path)/usr/include/libxml2" \
            -include tests/host-response/Support.h \
            Limelight/Network/HttpResponse.m Limelight/Network/AppListResponse.m \
            tests/host-response/HostResponseTests.m -o /tmp/host-response-tests
          ASAN_OPTIONS=detect_leaks=0 /tmp/host-response-tests
      - name: Test production credential redaction
        shell: bash
        run: |
          set -o pipefail
          xcrun clang -fobjc-arc -fsanitize=address,undefined -fno-omit-frame-pointer -framework Foundation \
            -I Limelight/Utility Limelight/Utility/Logger.m Limelight/Utility/LogBuffer.m \
            tests/logging/LogRedactionTests.m -o /tmp/log-redaction-tests
          ASAN_OPTIONS=detect_leaks=0 /tmp/log-redaction-tests 2>&1 | tee /tmp/log-redaction-output.txt
          if grep -q 'SENSITIVE_.*_VALUE' /tmp/log-redaction-output.txt; then
            echo 'Credential redaction failed for console output'
            exit 1
          fi
      - name: Download native dependencies
        run: |
          curl --fail --location --retry 3 -o xcframeworks.zip https://github.com/coofdy/moonlight-mobile-deps/releases/download/latest/moonlight-apple-xcframeworks.zip
          unzip -q -o xcframeworks.zip -d xcframeworks
      - name: Build full macOS application
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project Moonlight.xcodeproj -scheme 'Moonlight for macOS' \
            -configuration Release -derivedDataPath build -destination 'generic/platform=macOS' \
            ARCHS='${{ matrix.archs }}' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            BUILD_NUMBER='${{ github.run_number }}' build 2>&1 | tee build.log
      - name: Validate produced application
        shell: bash
        run: |
          app=build/Build/Products/Release/Moonlight.app
          for arch in ${{ matrix.archs }}; do
            lipo "$app/Contents/MacOS/Moonlight" -verify_arch "$arch"
            lipo "$app/Contents/Library/LaunchServices/std.skyhua.MoonlightMac.AwdlPrivilegedHelper" -verify_arch "$arch"
          done
          python3 scripts/audit_english.py --app "$app"
          python3 scripts/audit_update_isolation.py --app "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" 'Moonlight-manual-${{ matrix.variant }}.zip'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-manual-${{ matrix.variant }}
          path: |
            build.log
            Moonlight-manual-${{ matrix.variant }}.zip
          if-no-files-found: warn
  release:
    name: Publish validated regular release
    needs: build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: native-manual-*
          path: release-artifacts
      - name: Publish Intel and Universal downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "native-6.2-manual-${{ github.run_number }}" \
            release-artifacts/native-manual-x86_64/Moonlight-manual-x86_64.zip \
            release-artifacts/native-manual-universal/Moonlight-manual-universal.zip \
            --target '${{ github.sha }}' --latest \
            --title 'Moonlight Enhanced English — Manual Build ${{ github.run_number }} (Latest Manual)' \
            --notes-file docs/RELEASE_REVIEW_NOTES.md
  consolidate_branches:
    name: Archive and remove extra branches after validation
    needs: build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[consolidate-branches]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Preserve branch tips, verify leases, then remove branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'rebuild-moonlight-6.2-english'
            'rebuild-moonlight-6.2-english-manual'
            'codex/crimson-vibepollo-stats'
            'codex/vibepollo-discovery'
          )
          expected=(
            'ab03958a60edf4fc644c881382072aeef4677298'
            '328ea83b8e6856668b63930f8a6e6c1b64776102'
            '6691a9d84fa59325ef8605a999ee0a8e10b96a34'
            'f03fb401876108870b09f5dfd6dd45c74f00dbb3'
          )
          # Archive every tip before deleting anything. A changed branch stops cleanup.
          for i in "${!branches[@]}"; do
            branch="${branches[$i]}"
            sha="${expected[$i]}"
            actual=$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')
            test "$actual" = "$sha"
            tag="archive/2026-10-06/$branch"
            archived=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)
            if [ -z "$archived" ]; then
              gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$sha"
            else
              test "$archived" = "$sha"
            fi
          done
          for i in "${!branches[@]}"; do
            branch="${branches[$i]}"
            actual=$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')
            test "$actual" = "${expected[$i]}"
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
          done
          gh release edit native-6.2-rebuild-17 --latest=false
          gh release edit native-6.2-manual-4 --latest --title 'Moonlight Enhanced English — Manual Build 4'
          gh api "repos/$GH_REPO/branches" --jq '.[].name'
