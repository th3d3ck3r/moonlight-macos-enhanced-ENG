name: Validate Native 6.2 Rebuild
on:
  push:
    branches: [rebuild-moonlight-6.2-english]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-rebuild-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: macOS ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: x86_64
            runner: macos-26
            archs: x86_64
          - variant: universal
            runner: macos-26
            archs: x86_64 arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Audit English UI and LAN configuration
        run: python3 scripts/audit_english.py
      - name: Build and test customized common-c
        run: |
          cmake -S moonlight-common/moonlight-common-c -B common-test -DCMAKE_BUILD_TYPE=Debug
          cmake --build common-test --parallel 3
          ctest --test-dir common-test --output-on-failure
      - name: Test native host XML security and compatibility
        run: |
          xcrun clang -fobjc-arc -framework Foundation -lxml2 \
            -I tests/host-response -I Limelight/Network -I "$(xcrun --show-sdk-path)/usr/include/libxml2" \
            -include tests/host-response/Support.h \
            Limelight/Network/HttpResponse.m Limelight/Network/AppListResponse.m \
            tests/host-response/HostResponseTests.m -o /tmp/host-response-tests
          /tmp/host-response-tests
      - name: Download native dependencies
        run: |
          curl --fail --location --retry 3 -o xcframeworks.zip https://github.com/coofdy/moonlight-mobile-deps/releases/download/latest/moonlight-apple-xcframeworks.zip
          unzip -q -o xcframeworks.zip -d xcframeworks
      - name: Build full macOS application
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project Moonlight.xcodeproj -scheme 'Moonlight for macOS' \
            -configuration Release -derivedDataPath build -destination 'generic/platform=macOS' \
            ARCHS='${{ matrix.archs }}' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            BUILD_NUMBER='${{ github.run_number }}' build 2>&1 | tee build.log
      - name: Validate produced application
        shell: bash
        run: |
          app=build/Build/Products/Release/Moonlight.app
          for arch in ${{ matrix.archs }}; do
            lipo "$app/Contents/MacOS/Moonlight" -verify_arch "$arch"
            lipo "$app/Contents/Library/LaunchServices/std.skyhua.MoonlightMac.AwdlPrivilegedHelper" -verify_arch "$arch"
          done
          python3 scripts/audit_english.py --app "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" 'Moonlight-${{ matrix.variant }}.zip'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-rebuild-${{ matrix.variant }}
          path: |
            build.log
            Moonlight-${{ matrix.variant }}.zip
          if-no-files-found: warn
  prerelease:
    name: Publish tested rebuild prerelease
    needs: build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[prerelease]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: native-rebuild-*
          path: release-artifacts
      - name: Publish Intel and Universal downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "native-6.2-rebuild-${{ github.run_number }}" \
            release-artifacts/native-rebuild-x86_64/Moonlight-x86_64.zip \
            release-artifacts/native-rebuild-universal/Moonlight-universal.zip \
            --target '${{ github.sha }}' --prerelease \
            --title 'Moonlight Enhanced English — Intel/Tahoe 6.2 Rebuild' \
            --notes-file docs/PRERELEASE_NOTES.md
